# Publishes a release only when a version tag is pushed, e.g.
#   git tag v0.1.0 && git push origin v0.1.0
# A tag with a suffix (v0.2.0-beta.1) becomes a pre-release. Nothing else triggers this workflow.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # needed to create the release and upload the zip

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.ref_name }}   # passed through env, never spliced into scripts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read the version from the tag
        id: version
        shell: pwsh
        run: |
          $version = $env:TAG.Substring(1)
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Tag '$env:TAG' is not a version like v1.2.3 or v1.2.3-beta.1"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($version.Contains('-')) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test PhotoLibrary.slnx -c Release

      - name: Publish (self-contained, so users don't need .NET installed)
        shell: pwsh
        run: >
          dotnet publish src/PhotoLibrary.App -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.version.outputs.version }} -o publish

      - name: Trim the publish folder
        shell: pwsh
        run: |
          # Debug symbols and DirectML's debug layer are over half the size and never used by the app.
          Remove-Item publish/*.pdb, publish/DirectML.Debug.*, publish/*.lib -ErrorAction SilentlyContinue
          Rename-Item publish/PhotoLibrary.App.exe Keepsake.exe
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md publish/

      - name: Build the installer and update packages (Velopack)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet tool install -g vpk --version 1.2.161   # keep in step with the Velopack package in PhotoLibrary.App.csproj
          # The previous release lets vpk build a small delta update. There is none the first time.
          vpk download github --repoUrl "https://github.com/$env:GITHUB_REPOSITORY" --token $env:GH_TOKEN -o releases
          if ($LASTEXITCODE -ne 0) { Write-Host "No previous release; full package only."; $global:LASTEXITCODE = 0 }
          vpk pack --packId Keepsake --packVersion $env:VERSION --packDir publish --mainExe Keepsake.exe `
            --packTitle Keepsake --packAuthors "Keepsake contributors" --icon src/PhotoLibrary.App/Assets/keepsake.ico -o releases
          foreach ($f in 'Keepsake-win-Setup.exe', 'Keepsake-win-Portable.zip') {
            $hash = (Get-FileHash "releases/$f" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $f" | Out-File "releases/$f.sha256" -Encoding ascii -NoNewline
          }

      - name: Create the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          # Only this version's files; older packages downloaded for the delta stay on their own releases.
          $assets = @(Get-ChildItem releases -File | Where-Object {
              $_.Name -like "Keepsake-$env:VERSION-*" -or $_.Name -like 'Keepsake-win-*' -or
              $_.Name -in 'releases.win.json', 'assets.win.json', 'RELEASES' } | ForEach-Object FullName)
          $releaseArgs = @($env:TAG) + $assets + @('--title', "Keepsake $env:TAG", '--generate-notes', '--verify-tag')
          if ($env:PRERELEASE -eq 'true') { $releaseArgs += '--prerelease' }
          gh release create @releaseArgs
